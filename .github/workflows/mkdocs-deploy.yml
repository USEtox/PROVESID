name: Documentation

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'examples/**'
      - 'src/**'
      - 'mkdocs.yml'
      - 'scripts/mkdocs_hooks.py'
      - 'pyproject.toml'
      - '.github/workflows/mkdocs-deploy.yml'
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      # mkdocstrings imports provesid to read its docstrings, so the package
      # and its runtime dependencies have to be installed, not just mkdocs.
      - name: Install the package and the docs toolchain
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[docs]'

      # --strict, so a broken cross-reference or a malformed docstring fails
      # the build instead of quietly shipping a wrong page.
      - name: Build the documentation
        run: mkdocs build --strict

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  # Deploy job
  deploy:
    needs: build-site

    # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source

    # Deploy to the github-pages environment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    # Specify runner + deployment step
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
