site_name: PROVESID Documentation
site_description: A Python package for chemical identifier resolution and experimental property extraction
site_author: PROVESID Team
site_url: https://usetox.github.io/PROVESID/

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - search.highlight
    - search.share
    - toc.integrate
  palette:
    - scheme: default
      primary: blue
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: blue
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - Quick Start: quickstart.md
  - Guides:
    - Installing the offline databases: guide/datasets.md
    - Resolving identifiers with Search: guide/search.md
    - Using the local databases directly: guide/local-databases.md
    - Experimental properties from PubChem: guide/experimental-properties.md
    - Network behaviour: guide/network.md
    - Caching: guide/caching.md
    - API keys: guide/api-keys.md
    - Chebifier taxonomy: guide/chebifier.md
  # The tutorials live in examples/, not docs/: scripts/mkdocs_hooks.py
  # serves them at these paths.
  - Tutorials:
    - PubChem: examples/pubchem/pubchem_tutorial.md
    - PubChem View: examples/pubchemview/pubchem_view_tutorial.md
    - ChEMBL: examples/chembl/chembl_tutorial.md
    - ChEBI: examples/ChEBI/ChEBI_tutorial.md
    - ChEBI SDF: examples/ChEBI/chebi_sdf_tutorial.md
    - ZeroPM: examples/zeropm/zeropm-example.md
    - Chemical ID Resolver: examples/resolver/chem_id_resolver_tutorial.md
    - CAS Common Chemistry: examples/CCC/CAS_Common_Chemistry_tutorial.md
    - OPSIN: examples/OPSIN/opsin_tutorial.md
    - ClassyFire: examples/ClassyFire/classyfire_tutorial.md
  - API Reference:
    - Overview: api/index.md
    - Search: api/search.md
    - Datasets: api/datasets.md
    - Offline databases:
      - PubChemID: api/pubchem_id.md
      - CompToxID: api/comptox.md
      - ChebiSDF: api/chebi_sdf.md
      - CheMBL: api/chembl.md
      - ZeroPM: api/zeropm.md
      - REACHDossierID: api/reach.md
      - SQLiteClient: api/sqlite_clients.md
    - Online services:
      - PubChemAPI: api/pubchem.md
      - PubChemView: api/pubchemview.md
      - NCI resolver: api/nci_resolver.md
      - ChEBI: api/chebi.md
      - CAS Common Chemistry: api/cascommonchem.md
      - OPSIN: api/opsin.md
      - ClassyFire: api/classyfire.md
    - Taxonomy: api/taxonomy.md
    - Infrastructure:
      - HTTP transport: api/http.md
      - Cache: api/cache.md
      - Configuration: api/config.md
      - Utilities: api/utilities.md

hooks:
  - scripts/mkdocs_hooks.py

markdown_extensions:
  - toc:
      permalink: true
  - admonition
  - codehilite:
      guess_lang: false
  - def_list
  - footnotes
  - meta
  - pymdownx.arithmatex
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:pymdownx.emoji.twemoji
      emoji_generator: !!python/name:pymdownx.emoji.to_svg
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences
  - pymdownx.tabbed
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

plugins:
  - search
  - mkdocs-jupyter:
      execute: !ENV [PROVESID_DOCS_EXECUTE, false]
      allow_errors: false
      include_source: true
      ignore_h1_titles: true
      remove_tag_config:
        remove_input_tags:
          - hide_code
  - mkdocstrings:
      handlers:
        python:
          options:
            # Most modules are Google-style; chembl, comptox, reach and zeropm
            # are NumPy-style. "auto" detects the style of each docstring,
            # which a per-page docstring_style cannot do for a class's members.
            docstring_style: auto
            docstring_options:
              default: google
              per_style_options:
                google:
                  # A Returns: section here is one value described in prose
                  # and wrapped over several lines; parsed the default way,
                  # every line became a separate returned value.
                  returns_multiple_items: false
                  # Many signatures carry no annotations and the docstrings
                  # give types in prose; each would be a warning otherwise.
                  warn_missing_types: false
                numpy:
                  warn_missing_types: false
            show_source: true
            show_root_heading: true
            show_root_toc_entry: true
            show_object_full_path: false
            show_category_heading: true
            members_order: source
            # Constants are documented in their docstrings; their values
            # (DATASETS, LOOKUPS, PRESETS) would fill the heading.
            show_attribute_values: false

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/provesid/provesid
  version:
    provider: mike

extra_css:
  - stylesheets/extra.css

# Under --strict, a link to a missing page or a missing heading fails the
# build rather than shipping a dead link.
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn
